name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.0.5-spring)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release
    runs-on: ubuntu-22.04

    steps:
      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [ -z "$TAG" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "asset_prefix=simple-obfs-${TAG}-linux-x86_64" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libev-dev libpcre3-dev zlib1g-dev

      - name: Configure and build
        run: |
          ./autogen.sh
          ./configure --disable-documentation --prefix=/usr
          make -j"$(nproc)"

      - name: Package artifacts
        run: |
          set -euo pipefail
          PREFIX="${{ steps.meta.outputs.asset_prefix }}"
          DEST="dist/${PREFIX}"
          mkdir -p "${DEST}"
          install -m 755 src/obfs-local "${DEST}/obfs-local"
          install -m 755 src/obfs-server "${DEST}/obfs-server"
          cp README.md LICENSE Changes "${DEST}/" 2>/dev/null || true
          {
            echo "simple-obfs ${{ steps.meta.outputs.tag }}"
            echo "Built on: $(uname -a)"
            echo "Compiler: $(gcc --version | head -n1)"
            echo "Commit: $(git rev-parse HEAD)"
          } > "${DEST}/BUILD_INFO.txt"

          cd dist
          tar -czf "${PREFIX}.tar.gz" "${PREFIX}"
          sha256sum "${PREFIX}.tar.gz" > "${PREFIX}.tar.gz.sha256"
          ls -lh "${PREFIX}.tar.gz" "${PREFIX}.tar.gz.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.asset_prefix }}
          path: |
            dist/${{ steps.meta.outputs.asset_prefix }}.tar.gz
            dist/${{ steps.meta.outputs.asset_prefix }}.tar.gz.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: simple-obfs ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.asset_prefix }}.tar.gz
            dist/${{ steps.meta.outputs.asset_prefix }}.tar.gz.sha256
          body: |
            ## simple-obfs ${{ steps.meta.outputs.tag }}

            ### Artifacts
            - `${{ steps.meta.outputs.asset_prefix }}.tar.gz` — Linux x86_64 binaries (`obfs-local`, `obfs-server`)
            - `${{ steps.meta.outputs.asset_prefix }}.tar.gz.sha256` — SHA256 checksum

            ### Build notes
            - Built with `--disable-documentation`
            - Ubuntu 22.04 / GCC
            - Commit: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
